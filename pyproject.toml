[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-ai-agent"
version = "0.1.0"
description = "Safe WhatsApp Cloud API assistant with deterministic offline demo, tool calling and appointments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Ramon Rodriguez"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
whatsapp-ai-agent = "whatsapp_ai_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whatsapp_ai_agent = ["static/*.html", "prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
