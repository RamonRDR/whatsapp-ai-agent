name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]" pytest-asyncio build
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit, API and mock integration tests
        env:
          DATABASE_URL: "sqlite:///./ci-agent.db"
          ENABLE_REAL_SEND: "false"
          LLM_PROVIDER: "deterministic"
        run: pytest -q
      - name: Alembic migration from empty database
        env:
          DATABASE_URL: "sqlite:///./ci-migrations.db"
        run: alembic upgrade head && alembic current
      - name: Build package
        run: python -m build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t whatsapp-ai-agent:ci .
